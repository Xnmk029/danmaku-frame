<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <!-- 表情图片来自 i0.hdslb.com CDN，防盗链校验 Referer；不发送 Referer 才能加载 -->
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (() => {
      const requested = new URLSearchParams(location.search).get('theme');
      const saved = localStorage.getItem('xnmk-ui-theme');
      const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme =
        requested === 'light' || requested === 'dark' ? requested :
        saved === 'light' || saved === 'dark' ? saved : system;
    })();
  </script>
  <title>XNMK LIVE FRAME — Watch Dogs Branch UI (gemini3.6)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #d4ff00;
      --accent-dim: rgba(212, 255, 0, 0.15);
      --accent-glow: rgba(212, 255, 0, 0.45);
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.15);
      --cyan-glow: rgba(0, 240, 255, 0.4);
      --pink: #ff0055;
      --pink-dim: rgba(255, 0, 85, 0.18);
      --bg-dark: #0a0b0e;
      --bg-panel: rgba(10, 11, 14, 0.88);
      --bg-frame: rgba(8, 9, 12, 0.94);
      --text-primary: #ffffff;
      --text-secondary: #9098a8;
      --border: rgba(255, 255, 255, 0.12);
      --font-mono: 'Share Tech Mono', 'JetBrains Mono', 'Consolas', monospace;
      --font-orbitron: 'Orbitron', 'Share Tech Mono', monospace;
      --font-rajdhani: 'Rajdhani', sans-serif;
      --frame-thickness: 3px;
      --danmaku-width: 260px;
      --dm-font-size: 16px;
      --dm-font-family: Inter, 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      font-family: var(--font-mono);
      color: var(--text-primary);
      user-select: none;
    }

    /* === WATCH DOGS CANVAS BACKGROUND === */
    #cyberCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      z-index: 2;
      background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
    }

    .vignette-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 35%, rgba(5, 5, 8, 0.88) 100%);
    }

    /* Clip Path Utilities */
    .clip-cyber-corner {
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    }

    .clip-cyber-card {
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
    }

    /* === 16:9 VIEWPORT & DEDSEC FRAME === */
    .frame-viewport {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .frame-outer {
      position: relative;
      width: calc(100vh * 16 / 9);
      max-width: 100vw;
      height: calc(100vw * 9 / 16);
      max-height: 100vh;
      background: rgba(10, 11, 14, 0.4);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    .frame-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      box-shadow: none;
      opacity: 0;
      transition: opacity 0.4s ease, box-shadow 0.4s ease;
    }

    .frame-outer.rgb-glow .frame-glow {
      opacity: 1;
      box-shadow: inset 0 0 80px 15px var(--accent-glow), inset 0 0 180px 35px var(--accent-dim);
    }

    /* Watch Dogs Double Border */
    .frame-outer::before {
      content: '';
      position: absolute;
      inset: 0;
      border: var(--frame-thickness) solid var(--accent);
      opacity: 0.9;
      pointer-events: none;
      z-index: 10;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .frame-outer::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px dashed rgba(0, 240, 255, 0.35);
      pointer-events: none;
      z-index: 10;
    }

    /* Dynamic FX Modes — Theme-based Flow Light */
    @keyframes fxFlowBeam {
      0%, 100% {
        box-shadow: 0 0 15px var(--accent-glow), inset 0 0 30px var(--accent-dim);
        border-color: var(--accent);
      }
      50% {
        box-shadow: 0 0 35px var(--accent-glow), inset 0 0 75px var(--accent-glow), 0 0 60px var(--accent-dim);
        border-color: #ffffff;
      }
    }

    @keyframes fxPulseAnimation {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.002); }
    }

    .frame-outer.fx-flow::before {
      animation: fxFlowBeam 2.2s ease-in-out infinite;
    }

    .frame-outer.fx-pulse {
      animation: fxPulseAnimation 2.5s ease-in-out infinite;
    }

    /* Corner Ticks — DedSec Angular Accents */
    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      z-index: 11;
      pointer-events: none;
    }

    .corner::before,
    .corner::after {
      content: '';
      position: absolute;
      background: var(--accent);
      transition: background 0.2s ease;
    }

    .corner::before {
      width: 100%;
      height: 3px;
    }

    .corner::after {
      width: 3px;
      height: 100%;
    }

    .corner.tl { top: -3px; left: -3px; }
    .corner.tr { top: -3px; right: -3px; }
    .corner.tr::before { right: 0; }
    .corner.tr::after { right: 0; }
    .corner.bl { bottom: -3px; left: -3px; }
    .corner.bl::before { bottom: 0; }
    .corner.bl::after { bottom: 0; }
    .corner.br { bottom: -3px; right: -3px; }
    .corner.br::before { right: 0; bottom: 0; }
    .corner.br::after { right: 0; bottom: 0; }

    /* Top Telemetry Header */
    .telemetry-header {
      position: absolute;
      top: 10px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 12;
      pointer-events: none;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .dedsec-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 11, 14, 0.85);
      border: 1px solid var(--accent);
      padding: 3px 10px;
      font-family: var(--font-orbitron);
      font-weight: 800;
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .dedsec-brand .skull-icon {
      width: 12px;
      height: 12px;
      background: var(--accent);
      clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 20% 100%, 0% 35%);
    }

    .telemetry-stats {
      display: flex;
      gap: 14px;
      color: var(--text-secondary);
      font-weight: 600;
      background: rgba(10, 11, 14, 0.7);
      padding: 3px 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-val {
      color: var(--cyan);
      font-family: var(--font-mono);
    }

    /* === LEFT DANMAKU PANEL (Elevated 300px from bottom for preview area) === */
    .danmaku-panel {
      position: absolute;
      top: 42px;
      left: 14px;
      bottom: 348px; /* Elevated 300px above bottom */
      width: var(--danmaku-width);
      display: flex;
      flex-direction: column;
      pointer-events: none;
      z-index: 12;

      background: linear-gradient(180deg, rgba(10, 11, 14, 0.92) 0%, rgba(6, 7, 10, 0.82) 100%);
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 240, 255, 0.05);
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
      transition: width 0.2s ease, bottom 0.2s ease;
    }

    .panel-header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 240, 255, 0.06);
    }

    .panel-header .dot {
      width: 7px;
      height: 7px;
      background: var(--pink);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--pink);
    }

    .panel-header .title {
      font-family: var(--font-orbitron);
      font-size: 11px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .panel-header .status {
      margin-left: auto;
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .panel-header .status.live {
      color: var(--accent);
      text-shadow: 0 0 6px var(--accent-glow);
    }

    .danmaku-feed {
      flex: 1;
      overflow-y: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px;
      gap: 6px;
    }

    /* Watch Dogs Message Row Cards */
    .dm-row {
      font-size: var(--dm-font-size);
      font-family: var(--dm-font-family);
      line-height: 1.4;
      padding: 6px 10px;
      background: rgba(15, 18, 24, 0.75);
      border-left: 3px solid var(--cyan);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      word-break: break-all;
      animation: dmSlideIn 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      position: relative;
    }

    @keyframes dmSlideIn {
      from {
        opacity: 0;
        transform: translateX(-15px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .dm-row .sc {
      color: var(--accent);
      opacity: 0.85;
      font-weight: bold;
    }

    .dm-medal {
      display: inline-block;
      font-size: 10px;
      font-family: var(--font-rajdhani);
      font-weight: 700;
      padding: 1px 5px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      border-radius: 2px;
      margin-right: 5px;
      text-transform: uppercase;
    }

    .dm-user {
      font-weight: 700;
      margin-right: 6px;
      color: var(--accent);
    }

    .dm-user.user-ascii { color: var(--cyan); }
    .dm-user.user-cjk { color: var(--accent); }
    .dm-user.user-mixed { color: #f43f5e; }

    .dm-user.guard-3 {
      color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    }

    .dm-user.guard-2 {
      color: #ff0055;
      text-shadow: 0 0 10px rgba(255, 0, 85, 0.7);
    }

    .dm-user.guard-1 {
      color: #d4ff00;
      text-shadow: 0 0 12px rgba(212, 255, 0, 0.8);
    }

    .dm-num { color: var(--cyan); font-weight: bold; }
    .dm-sym { color: var(--pink); font-weight: bold; }

    /* Special Gift & SuperChat Watch Dogs Alerts */
    .dm-row.type-gift {
      background: rgba(212, 255, 0, 0.12);
      border-left-color: var(--accent);
      border-top: 1px solid var(--accent);
      box-shadow: 0 0 12px rgba(212, 255, 0, 0.2);
    }

    .dm-row.type-sc {
      background: rgba(255, 0, 85, 0.18);
      border-left-color: var(--pink);
      border-top: 1px solid var(--pink);
      border-bottom: 1px solid var(--pink);
      box-shadow: 0 0 16px rgba(255, 0, 85, 0.35);
    }

    .dm-row.type-sc .dm-text {
      color: #ffffff;
      font-weight: bold;
    }

    /* === Bilibili emote images (emots / big emote) === */
    .dm-row .dm-emoji {
      height: 1.3em;
      vertical-align: -0.28em;
      margin: 0 2px;
    }
    .dm-row .dm-emoji.size-m { height: 1.9em; }
    .dm-row .dm-emoji.size-l { height: 2.6em; }
    .dm-row.type-bigemote {
      background: rgba(0, 240, 255, 0.06);
      border-left-color: var(--cyan);
    }
    .dm-row.type-bigemote .dm-bigemote {
      display: block;
      max-width: 100%;
      max-height: 96px;
      margin: 4px 0 2px;
      object-fit: contain;
    }

    /* === NCM 播放卡片（AMLL 联动，弹幕区域下方 160px，DS 变量适配亮暗主题） === */
    .ncm-card {
      position: absolute;
      left: 14px;
      bottom: 176px;
      width: var(--danmaku-width);
      height: 160px;
      display: flex;
      gap: 10px;
      padding: 12px;
      background: color-mix(in srgb, var(--ds-sidebar) 92%, transparent);
      border: 1px solid var(--ds-border);
      border-radius: 14px;
      box-shadow: var(--ds-shadow);
      backdrop-filter: blur(16px);
      z-index: 12;
      pointer-events: none;
      box-sizing: border-box;
    }
    .ncm-card[hidden] { display: none; }
    .ncm-cover {
      width: 88px; height: 88px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--ds-layer-1);
      align-self: center;
      flex-shrink: 0;
    }
    .ncm-cover.hidden { display: none; }
    .ncm-body {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; justify-content: center; gap: 5px;
    }
    .ncm-top { display: flex; align-items: baseline; gap: 6px; }
    .ncm-title {
      flex: 1; min-width: 0;
      overflow: hidden; white-space: nowrap;
      font-size: 13px; font-weight: 600; color: var(--ds-text);
    }
    .ncm-title .mt, .ncm-artist .mt {
      display: inline-block;
      white-space: nowrap;
      animation: ncmMarquee 10s linear infinite;
      animation-play-state: paused;
      /* 默认无 padding：静态显示在容器内 */
    }
    .ncm-title.marquee-on .mt, .ncm-artist.marquee-on .mt {
      padding-left: 100%; /* 仅滚动时：起点位于右缘外 */
      animation-play-state: running;
    }
    @keyframes ncmMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }
    .ncm-led { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .ncm-led.playing { background: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.6); }
    .ncm-led.paused  { background: #ff9f0a; box-shadow: 0 0 8px rgba(255, 159, 10, 0.6); }
    .ncm-artist {
      overflow: hidden; white-space: nowrap;
      font-size: 11px; color: var(--ds-text-secondary);
    }
    .ncm-bar { height: 3px; background: var(--ds-layer-1); border-radius: 999px; overflow: hidden; }
    .ncm-fill { height: 100%; width: 0%; background: var(--ds-primary); border-radius: 999px; transition: width 0.5s linear; }
    .ncm-time {
      display: flex; justify-content: space-between;
      font-size: 9px; color: var(--ds-text-tertiary); font-variant-numeric: tabular-nums;
    }

    /* === DEDSEC BOTTOM TICKER STATUS BAR (Exact Layout Matching Image 2) === */
    .bottom-ticker-bar {
      position: absolute;
      bottom: 12px;
      left: 240px; /* Offset 240px from left border */
      right: 14px;
      height: 52px; /* Enhanced height for Image 2 layout proportion */
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      z-index: 12;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .bottom-ticker-bar.hidden {
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
    }

    .ticker-section {
      display: flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
    }

    .ticker-left {
      flex: 1;
      overflow: hidden;
    }

    .prompt-symbol {
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      font-family: var(--font-mono);
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .ticker-tag {
      background: rgba(10, 11, 14, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--text-secondary);
      font-size: 14px;
      padding: 4px 12px;
      border-radius: 2px;
      letter-spacing: 1px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .ticker-tag.tag-current {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 10px var(--accent-dim);
    }

    .ticker-tag.tag-next {
      border-color: var(--cyan);
      color: var(--cyan);
      background: var(--cyan-dim);
      box-shadow: 0 0 10px var(--cyan-dim);
    }

    .ticker-text {
      font-weight: 900;
      font-size: 22px; /* High-visibility large font size matching Image 2 */
      letter-spacing: 1px;
      font-family: var(--font-mono);
    }

    .ticker-text.text-current {
      color: var(--accent);
      text-shadow: 0 0 16px var(--accent-glow);
    }

    .ticker-text.text-next {
      color: var(--cyan);
      font-size: 20px;
      text-shadow: 0 0 14px var(--cyan-glow);
    }

    .ticker-divider {
      width: 2px;
      height: 24px;
      background: rgba(255, 255, 255, 0.25);
      margin: 0 8px;
    }

    .ticker-right {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      padding-top: 4px;
    }

    /* Yellow Accent line above Model badge matching Image 2 */
    .ticker-right::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .ticker-label {
      font-size: 15px;
      color: var(--text-secondary);
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .model-badge {
      font-family: var(--font-orbitron);
      font-weight: 900;
      font-size: 22px; /* Prominent block badge matching Image 2 */
      color: #06070a;
      background: var(--accent);
      padding: 6px 20px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 20px var(--accent-glow);
      text-transform: uppercase;
      border-radius: 1px;
    }

    /* Frame Label */
    .frame-label {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 10px;
      font-family: var(--font-orbitron);
      letter-spacing: 2px;
      color: var(--text-secondary);
      opacity: 0.6;
      z-index: 11;
    }

    /* === CONTROL BAR === */
    .ctrl-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: rgba(8, 9, 12, 0.95);
      border-top: 1px solid var(--accent);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      z-index: 100;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ctrl-bar.hidden {
      transform: translateY(100%);
    }

    .ctrl-bar input[type="text"] {
      height: 28px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-radius: 2px;
    }

    .ctrl-bar input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    #roomInput { width: 170px; }

    .ctrl-btn {
      height: 28px;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .ctrl-btn:hover {
      background: var(--accent);
      color: #06070a;
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .ctrl-btn.active {
      background: var(--accent);
      color: #06070a;
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .ctrl-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
    }

    .color-ctrl {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .color-swatch.sel {
      border: 2px solid #ffffff;
      box-shadow: 0 0 8px currentColor;
    }

    .rgb-swatch {
      height: 20px;
      padding: 0 6px;
      font-size: 9px;
      font-weight: 900;

    /* ============================================================
       WATCH DOGS CANVAS BACKGROUND ANIMATION
       ============================================================ */
    (function initCyberBackground() {
      const canvas = document.getElementById('cyberCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const nodes = Array.from({ length: 30 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.7,
        vy: (Math.random() - 0.5) * 0.7,
        char: String.fromCharCode(0x30a0 + Math.floor(Math.random() * 96))
      }));

      let scanY = 0;

      function render() {
        ctx.fillStyle = 'rgba(10, 11, 14, 0.45)';
        ctx.fillRect(0, 0, width, height);

        // Faint Cyber Grid
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1;
        const gridSize = 60;
        for (let x = 0; x < width; x += gridSize) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y < height; y += gridSize) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        // SF City Wireframe Perspective Simulation
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
        ctx.beginPath();
        ctx.moveTo(width * 0.1, height);
        ctx.lineTo(width * 0.4, height * 0.25);
        ctx.lineTo(width * 0.7, height * 0.25);
        ctx.lineTo(width * 0.95, height);
        ctx.stroke();

        // Connected ASCII Nodes
        ctx.fillStyle = 'rgba(212, 255, 0, 0.6)';
        ctx.font = '11px "Share Tech Mono", monospace';

        nodes.forEach((node, i) => {
          node.x += node.vx;
          node.y += node.vy;
          if (node.x < 0 || node.x > width) node.vx *= -1;
          if (node.y < 0 || node.y > height) node.vy *= -1;

          ctx.fillText(node.char, node.x, node.y);

          for (let j = i + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const dist = Math.hypot(node.x - n2.x, node.y - n2.y);
            if (dist < 130) {
              ctx.strokeStyle = `rgba(0, 240, 255, ${0.12 - dist / 1300})`;
              ctx.beginPath();
              ctx.moveTo(node.x, node.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.stroke();
            }
          }
        });

        // Horizontal Scanline Sweep
        scanY = (scanY + 1.5) % height;
        ctx.strokeStyle = 'rgba(212, 255, 0, 0.08)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, scanY);
        ctx.lineTo(width, scanY);
        ctx.stroke();

        // Glitch slice
        if (Math.random() < 0.03) {
          const sliceY = Math.random() * height;
          ctx.fillStyle = 'rgba(255, 0, 85, 0.05)';
          ctx.fillRect(0, sliceY, width, Math.random() * 15 + 2);
        }

        requestAnimationFrame(render);
      }

      render();
    })();

    /* ============================================================
       SYNTAX HIGHLIGHTER FOR DANMAKU TEXT
       ============================================================ */
    function formatSyntax(text) {
      if (!text) return '';
      const esc = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      return esc.replace(/([0-9]+|[\{\}\[\]\(\)]|[!@#\$%\^&\*\+\=\-\/\\\|:<>\?`~,\._"']+)/g, (match) => {
        if (/^[0-9]+$/.test(match)) {
          return `<span class="dm-num">${match}</span>`;
        } else {
          return `<span class="dm-sym">${match}</span>`;
        }
      });
    }

    /* ============================================================
       SCRAMBLE TEXT ENGINE — Watch Dogs DedSec Decode
       ============================================================ */
    const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!<>-_\\/[]{}—=+*^?#アイウエオカキクケコサシスセソタチツテト';

    class ScrambleText {
      constructor() {
        this.chars = SCRAMBLE_CHARS;
      }

      decode(el, text, opts = {}) {
        const duration = opts.duration || 420;
        const interval = 30;
        const maxIter = Math.ceil(duration / interval);
        let iteration = 0;

        clearInterval(el._scrambleTimer);

        return new Promise(resolve => {
          el._scrambleTimer = setInterval(() => {
            const progress = iteration / maxIter;
            const revealCount = Math.floor(progress * text.length);

            let out = '';
            for (let i = 0; i < text.length; i++) {
              if (text[i] === ' ') { out += ' '; continue; }
              if (i < revealCount) {
                out += opts.plain ? ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[text[i]] || text[i]) : text[i];
              } else {
                out += '<span class="sc">' + this.chars[Math.floor(Math.random() * this.chars.length)] + '</span>';
              }
            }
            el.innerHTML = out;

            const row = el.closest('.dm-row');
            if (row && iteration % 2 === 0) {
              row.style.transform = 'translateX(' + (Math.random() > 0.5 ? 2 : -2) + 'px)';
            }

            iteration++;
            if (iteration > maxIter) {
              clearInterval(el._scrambleTimer);
              if (opts.plain) el.textContent = text;
              else el.innerHTML = formatSyntax(text);
              if (row) row.style.transform = 'none';
              resolve();
            }
          }, interval);
        });
      }
    }

    /* ============================================================
       DANMAKU RELAY CLIENT — ws://localhost:7789
       ============================================================ */
    class BiliDanmaku {
      constructor(cb) {
        this.cb = cb;
        this.ws = null;
        this.connected = false;
        this._roomId = '';
      }

      connect(roomId) {
        this._roomId = roomId || '';

        if (this.ws && this.ws.readyState === WebSocket.OPEN) {
          this.ws.send(JSON.stringify({ action: 'subscribe', roomId: this._roomId }));
          return;
        }

        this.disconnect();
        const host = (location.hostname && location.hostname !== 'null' && location.hostname !== '') ? location.hostname : '127.0.0.1';
        this.ws = new WebSocket(`ws://${host}:7789`);

        this.ws.onopen = () => {
          this.connected = true;
          if (this._roomId) {
            this.ws.send(JSON.stringify({ action: 'subscribe', roomId: this._roomId }));
          }
          this.ws.send(JSON.stringify({ action: 'ncm.subscribe' }));
          this.cb.status(true, `ROOM ${this._roomId || 'READY'}`);
        };

        this.ws.onmessage = (ev) => {
          try {
            const d = JSON.parse(ev.data);
            if (d.type === 'status') {
              this.cb.status(d.connected, d.message);
            } else if (d.type === 'popularity') {
              this.cb.popularity(d.value);
            } else if (d.type === 'voice.selection') {
              voiceCard.update(d);
            } else if (d.type === 'ncm.playback') {
              if (this.cb.ncm) this.cb.ncm(d);
            } else if (d.type === 'ncm.offline') {
              if (this.cb.ncmOffline) this.cb.ncmOffline();
            } else if (d.text && ['danmaku', 'gift', 'sc'].includes(d.type)) {
              // 仅聊天类事件上屏：watched/like/entry/guard 等互动数据不进边框（否则显示为「匿名黑客」噪音）
              this.cb.danmaku(d);
            }
          } catch (e) { }
        };

        this.ws.onerror = () => this.cb.status(false, 'ERROR');
        this.ws.onclose = () => {
          this.connected = false;
          this.cb.status(false, 'OFFLINE');
          clearTimeout(this._reconnect);
          this._reconnect = setTimeout(() => this.connect(this._roomId), 3000);
        };
      }

      disconnect() {
        clearTimeout(this._reconnect);
        if (this.ws) {
          if (this.ws.readyState === WebSocket.OPEN) {
            this.ws.send(JSON.stringify({ action: 'unsubscribe' }));
          }
          this.ws.onclose = null;
          this.ws.close();
          this.ws = null;
        }
        this.connected = false;
        this.cb.status(false, 'OFFLINE');
      }
    }

    /* 分段渲染：文字段保留 Scramble 解码，[表情] 段替换为图片 */
    function renderEmoteSegments(el, text, emots, scr) {
      const map = new Map(emots.map(e => [e.key, e]));
      const pattern = /\[[^\]]{1,24}\]/g;
      const addText = segText => {
        if (!segText) return;
        const seg = document.createElement('span');
        seg.className = 'dm-text-seg';
        el.appendChild(seg);
        scr.decode(seg, segText, { duration: 300 });
      };
      let last = 0;
      let match;
      while ((match = pattern.exec(text)) !== null) {
        addText(text.slice(last, match.index));
        const emote = map.get(match[0]);
        if (emote) {
          const img = document.createElement('img');
          img.className = 'dm-emoji' + (emote.size === 'L' ? ' size-l' : emote.size === 'M' ? ' size-m' : '');
          img.src = emote.url;
          img.alt = emote.key;
          img.draggable = false;
          // 防盗链/网络失败时回退为纯文本，避免破碎图图标
          img.onerror = () => img.replaceWith(document.createTextNode(emote.key));
          el.appendChild(img);
        } else {
          addText(match[0]); // 未注册表情名按文本显示
        }
        last = match.index + match[0].length;
      }
      addText(text.slice(last));
    }

      if (p.get('color')) setAccent(p.get('color'));
      if (p.get('rgb') === 'true') toggleRGB(true);
      setFX(p.get('fx') || 'flow');
      if (p.get('width')) { widthRange.value = p.get('width'); document.documentElement.style.setProperty('--danmaku-width', p.get('width') + 'px'); }
      if (p.get('fontsize')) { fontRange.value = p.get('fontsize'); document.documentElement.style.setProperty('--dm-font-size', p.get('fontsize') + 'px'); }
      if (p.get('font')) { fontSelect.value = p.get('font'); document.documentElement.style.setProperty('--dm-font-family', p.get('font')); }
      if (p.get('current') && tickerCurrentInput) { tickerCurrentInput.value = p.get('current'); }
      if (p.get('next') && tickerNextInput) { tickerNextInput.value = p.get('next'); }
      if (p.get('model') && tickerModelInput) { tickerModelInput.value = p.get('model'); }
      if (p.get('hideticker') === 'true') {
        bottomTickerBar.classList.add('hidden');
        if (tickerToggleBtn) {
          tickerToggleBtn.textContent = 'BAR: OFF';
          tickerToggleBtn.classList.remove('active');
        }
      }
      if (p.get('hidebar') === 'true') ctrlBar.classList.add('hidden');

      updateTickerDisplay(false);

      if (p.get('autoconnect') !== 'false') {
        bili.connect(parseRoomId(roomInput.value));
      }
    })();
  </script>
</body>

</html>
