<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NCM Now Playing</title>
<style>
/* DeepSeek 浅色极简播放卡片：封面 + 歌名 + 歌手 + 进度条 + 状态灯 */
:root {
  --primary: #4D7DFA;
  --text-primary: #1F2329;
  --text-secondary: #646A73;
  --text-muted: #8D8D8F;
  --border: #E6E7EB;
  --shadow: 0 1px 2px rgba(31, 35, 41, 0.05), 0 4px 16px rgba(31, 35, 41, 0.04);
  --font: -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: transparent; overflow: hidden; }
body { font-family: var(--font); color: var(--text-primary); -webkit-font-smoothing: antialiased; }

.card {
  display: none;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  width: max-content;
  max-width: 600px;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.card.show { display: flex; }

.cover {
  width: 64px; height: 64px;
  border-radius: 12px;
  object-fit: cover;
  background: #F0F1F3;
  flex-shrink: 0;
}
.cover.hidden { display: none; }

.meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.title {
  font-size: 17px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.artist {
  font-size: 13px; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar { width: 100%; height: 4px; background: #F0F1F3; border-radius: 999px; margin-top: 6px; overflow: hidden; }
.fill { height: 100%; width: 0%; background: var(--primary); border-radius: 999px; transition: width 0.5s linear; }
.time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; margin-top: 2px; }

.led { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.led.playing { background: #34C759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.5); }
.led.paused  { background: #FF9F0A; box-shadow: 0 0 6px rgba(255, 159, 10, 0.5); }
</style>
</head>
<body>
<div class="card" id="card">
  <img class="cover" id="cover" alt="">
  <div class="meta">
    <div class="title" id="title">—</div>
    <div class="artist" id="artist">—</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="time"><span id="cur">00:00</span><span id="dur">00:00</span></div>
  </div>
  <div class="led" id="led"></div>
</div>

<script>
'use strict';
/* 连接 danmaku-frame WS 网关，订阅 AMLL 播放信息（ncm.playback 事件） */
const params = new URLSearchParams(location.search);
const wsHost = (location.hostname && location.hostname !== 'null') ? location.hostname : '127.0.0.1';
const wsPort = params.get('wsPort') || '7789';
const $ = id => document.getElementById(id);

let socket = null;
let reconnectTimer = null;
let state = { song: null, cover: null, playing: false, paused: false, progress: 0, updatedAt: 0 };

function fmt(ms) {
  const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}

function render() {
  const card = $('card');
  if (!state.song) { card.classList.remove('show'); return; }
  card.classList.add('show');
  $('title').textContent = state.song.name || '未知歌曲';
  $('artist').textContent = (state.song.artists || []).join(' / ') || '未知歌手';
  $('dur').textContent = fmt(state.song.duration);
  $('led').className = 'led ' + (state.playing ? 'playing' : 'paused');

  const coverEl = $('cover');
  if (state.cover) {
    const url = state.cover.kind === 'uri'
      ? state.cover.url
      : `/api/ncm/cover?id=${encodeURIComponent(state.cover.id)}`;
    if (coverEl.src !== url) coverEl.src = url;
    coverEl.classList.remove('hidden');
  } else {
    coverEl.classList.add('hidden');
  }
}

function tick() {
  if (!state.song) return;
  let elapsed = state.progress;
  if (state.playing) elapsed += Date.now() - state.updatedAt;
  $('cur').textContent = fmt(elapsed);
  const total = Number(state.song.duration) || 0;
  $('fill').style.width = total ? `${Math.min(100, (elapsed / total) * 100)}%` : '0%';
}
setInterval(tick, 1000);

function connect() {
  clearTimeout(reconnectTimer);
  socket = new WebSocket(`ws://${wsHost}:${wsPort}`);
  socket.onopen = () => socket.send(JSON.stringify({ action: 'ncm.subscribe' }));
  socket.onmessage = ev => {
    let payload;
    try { payload = JSON.parse(ev.data); } catch { return; }
    if (payload.type === 'ncm.playback') {
      state = { ...payload, updatedAt: Date.now() };
      render();
      tick();
    } else if (payload.type === 'ncm.offline') {
      state = { song: null, cover: null, playing: false, paused: false, progress: 0, updatedAt: 0 };
      render();
    }
  };
  socket.onclose = () => { reconnectTimer = setTimeout(connect, 3000); };
  socket.onerror = () => { try { socket.close(); } catch { /* ignore */ } };
}
connect();
</script>
</body>
</html>
